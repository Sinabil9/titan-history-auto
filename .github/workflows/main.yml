name: TITAN HISTORY - One Click Upload

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: titan-history-daily
  cancel-in-progress: false

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng curl

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install piper-tts || true

      - name: Download Piper voice
        run: |
          mkdir -p models/piper
          curl -fL --retry 4 --retry-delay 5 \
            -o models/piper/en_US-lessac-medium.onnx \
            https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/lessac/medium/en_US-lessac-medium.onnx || true

          curl -fL --retry 4 --retry-delay 5 \
            -o models/piper/en_US-lessac-medium.onnx.json \
            https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/lessac/medium/en_US-lessac-medium.onnx.json || true

      - name: Install local Qwen
        continue-on-error: true
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve >/tmp/ollama.log 2>&1 &
          sleep 5
          ollama pull qwen3:1.7b

      - name: Prepare YouTube token
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          python scripts/write_token.py

      - name: Build and upload one Short
        run: |
          python main.py

      - name: Save anti-repeat history
        if: success()
        run: |
          git config user.name "titan-history-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/history.json

          if ! git diff --cached --quiet; then
            git commit -m "Update Titan History upload state"
            git push
          fi
